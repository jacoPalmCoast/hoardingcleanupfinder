name: Daily cron

on:
  schedule:
    - cron: '0 13 * * *'
  workflow_dispatch: {}

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger daily jobs
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          TOKEN="$(printf '%s' "$CRON_SECRET" | tr -d '[:space:]')"
          curl -fsS -X POST "https://hoardingcleanupfinder.jaco12210marbrook.workers.dev/api/cron/run" \
            -H "authorization: Bearer $TOKEN" \
            -w $'\nHTTP %{http_code}\n'
